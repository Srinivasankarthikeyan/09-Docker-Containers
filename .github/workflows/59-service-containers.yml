name: 59 - Service Containers
# This workflow demonstrates using service containers (e.g., Redis, Postgres).
# Exam Tip: Service containers are useful for integration testing.

on:
  workflow_dispatch:

jobs:
  test-with-redis:
    runs-on: ubuntu-latest
    
    # Service containers are started before the job steps
    services:
      redis:
        image: redis
        # Wait for redis to be ready
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Install Redis CLI
        run: sudo apt-get update && sudo apt-get install -y redis-tools

      - name: Redis live example (set/get)
        run: |
          redis-cli -h localhost -p 6379 ping
          redis-cli -h localhost -p 6379 set exam "gh-actions"
          value=$(redis-cli -h localhost -p 6379 get exam)
          echo "Redis value: $value"

          if [ "$value" != "gh-actions" ]; then
            echo "Redis integration test failed"
            exit 1
          fi

          echo "Redis integration test passed"
